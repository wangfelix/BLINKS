; Custom ESP-IDF build of the glasses firmware, for BLE + light sleep.
;
; The Arduino IDE cannot do this: it links precompiled ESP-IDF libraries built
; with CONFIG_PM_ENABLE unset, so tickless light sleep is unavailable there.
; "framework = arduino, espidf" rebuilds the IDF from source with the sdkconfig
; in sdkconfig.defaults, which is the only way to turn power management on.
;
; This is a PARALLEL build. glasses-camera-firmware/ remains the known-good
; Arduino target and shares the same source file, so nothing here can break it.

[env:blinks-glasses]
; Pinned to Arduino 3.3.8 / ESP-IDF 5.5.4 -- the SAME Arduino core the Arduino
; IDE build uses, so the sdkconfig is the only difference between the two
; targets. The stock PlatformIO "espressif32" platform is still on Arduino
; 2.0.x / IDF 4.4, which this sketch's APIs predate; pioarduino is the
; maintained fork that ships current cores.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = esp32-s3-devkitm-1
framework = arduino, espidf

; NOTE: build_opt.h / ble_power_config.h in the Arduino sketch folder are an
; Arduino IDE mechanism and are deliberately NOT used here. They exist only to
; force modem sleep into precompiled libraries. This build gets the real
; settings from sdkconfig.defaults, including the external 32 kHz crystal that
; the header could not select.

; -N4R2: 4 MB flash + 2 MB QUAD PSRAM. Must be qio_qspi, not opi.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size         = 4MB
board_upload.maximum_size       = 4194304
board_build.partitions          = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0

; The Arduino component drags in esp_insights and esp_rainmaker, which embed
; these certificates at build time. Nothing here uses either, but the build
; fails without the paths declared.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; Pinned deliberately. Auto-detect grabs the first /dev/cu.usbmodem* it finds,
; and when the board is unplugged that can be something else entirely -- an LG
; monitor answered here once, producing "No serial data received", which reads
; exactly like a bricked board. If the port name changes (different USB socket),
; run: ls /dev/cu.usbmodem*   and pick the one that is digits only.
upload_port  = /dev/cu.usbmodem202201
monitor_port = /dev/cu.usbmodem202201

monitor_speed = 115200
