# /etc/apache2/sites-available/blinks.conf
#
# Port 80 does nothing but redirect to HTTPS. It must NOT proxy to the API,
# otherwise bearer tokens and frames would be reachable in plaintext.
# Certbot's HTTP-01 renewal still works: Let's Encrypt follows the redirect.

<VirtualHost *:80>
    ServerName blinks.win.kit.edu

    RewriteEngine On
    RewriteCond %{SERVER_NAME} =blinks.win.kit.edu
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/blinks_error.log
    CustomLog ${APACHE_LOG_DIR}/blinks_access.log combined
</VirtualHost>
