# /etc/apache2/sites-available/blinks-le-ssl.conf
#
# Apache terminates TLS and fronts two Node processes:
#   :3000  server/    API + WebSocket ingestion  -> /api /ingest /frames /health
#   :3001  drm-web/   participant website        -> everything else
#
# Order matters: the specific paths must come before the catch-all `/`.
# The `ws://` target on /ingest is correct even though clients connect with
# wss:// — Apache terminates TLS and speaks plaintext WebSocket to the API.
# Requires: proxy proxy_http proxy_wstunnel headers ssl rewrite.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName blinks.win.kit.edu

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # API server (:3000)
    ProxyPass        /ingest ws://127.0.0.1:3000/ingest
    ProxyPassReverse /ingest ws://127.0.0.1:3000/ingest
    ProxyPass        /api    http://127.0.0.1:3000/api
    ProxyPassReverse /api    http://127.0.0.1:3000/api
    ProxyPass        /frames http://127.0.0.1:3000/frames
    ProxyPassReverse /frames http://127.0.0.1:3000/frames
    ProxyPass        /health http://127.0.0.1:3000/health
    ProxyPassReverse /health http://127.0.0.1:3000/health

    # DRM web app (:3001)
    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/blinks_error.log
    CustomLog ${APACHE_LOG_DIR}/blinks_access.log combined

SSLCertificateFile /etc/letsencrypt/live/blinks.win.kit.edu/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/blinks.win.kit.edu/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
