<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41525e"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a70"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="580" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#243441">Visual scene understanding as a shared context layer</text>
  <text x="580" y="66" text-anchor="middle" font-size="13" fill="#5a6b78">A single VLM-derived descriptor stream resolves biosignal labeling ambiguity and adaptive survey timing in parallel</text>

  <!-- ===================== Main pipeline ===================== -->

  <!-- Box 1: Camera (input) -->
  <rect x="40" y="200" width="160" height="100" rx="10" fill="#e8f1fb" stroke="#2e6ca4" stroke-width="1.5"/>
  <text x="120" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">Wearable</text>
  <text x="120" y="259" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">egocentric camera</text>
  <text x="120" y="282" text-anchor="middle" font-size="11" fill="#5a6b78">JPEG &#183; ~1 fps &#183; NTP</text>

  <!-- Box 2: VLM -->
  <rect x="250" y="200" width="160" height="100" rx="10" fill="#fdf3e3" stroke="#c77f1a" stroke-width="1.5"/>
  <text x="330" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">VLM scene</text>
  <text x="330" y="259" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">understanding</text>
  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#5a6b78">per-frame inference</text>

  <!-- Box 3: Descriptors (centerpiece) -->
  <rect x="460" y="170" width="240" height="160" rx="10" fill="#fdf3e3" stroke="#c77f1a" stroke-width="2"/>
  <text x="580" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">Scene-state descriptors</text>
  <text x="580" y="227" text-anchor="middle" font-size="12" fill="#3a4a56">posture &#183; movement</text>
  <text x="580" y="249" text-anchor="middle" font-size="12" fill="#3a4a56">screen engagement</text>
  <text x="580" y="271" text-anchor="middle" font-size="12" fill="#3a4a56">object manipulation</text>
  <text x="580" y="293" text-anchor="middle" font-size="12" fill="#3a4a56">proximity &#183; social interaction</text>
  <text x="580" y="316" text-anchor="middle" font-size="10" font-style="italic" fill="#8a97a1">per-image intermediate representation</text>

  <!-- Box 4: CPD -->
  <rect x="750" y="200" width="160" height="100" rx="10" fill="#fdf3e3" stroke="#c77f1a" stroke-width="1.5"/>
  <text x="830" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">Change point</text>
  <text x="830" y="259" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">detection</text>
  <text x="830" y="282" text-anchor="middle" font-size="11" fill="#5a6b78">segment boundaries</text>

  <!-- Branch: upper (EMA) -->
  <rect x="965" y="120" width="180" height="100" rx="10" fill="#e5f6f2" stroke="#1f8a70" stroke-width="1.5"/>
  <text x="1055" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#243441">Adaptive, context-aware</text>
  <text x="1055" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#243441">survey timing</text>
  <text x="1055" y="194" text-anchor="middle" font-size="11" fill="#5a6b78">EMA / ESM prompts</text>

  <!-- Branch: lower (biosignal) -->
  <rect x="965" y="300" width="180" height="110" rx="10" fill="#e5f6f2" stroke="#1f8a70" stroke-width="1.5"/>
  <text x="1055" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#243441">Biosignal segmentation</text>
  <text x="1055" y="351" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#243441">&amp; contextual labels</text>
  <text x="1055" y="374" text-anchor="middle" font-size="11" fill="#5a6b78">resolves labeling</text>
  <text x="1055" y="389" text-anchor="middle" font-size="11" fill="#5a6b78">ambiguity</text>

  <!-- Biosignal input -->
  <rect x="460" y="430" width="220" height="80" rx="10" fill="#e8f1fb" stroke="#2e6ca4" stroke-width="1.5"/>
  <text x="570" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#243441">Biosignals</text>
  <text x="570" y="485" text-anchor="middle" font-size="11" fill="#5a6b78">Cardioban EKG &#183; Mendi fNIRS</text>

  <!-- Arrows: main chain -->
  <line x1="200" y1="250" x2="248" y2="250" stroke="#41525e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="250" x2="458" y2="250" stroke="#41525e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="250" x2="748" y2="250" stroke="#41525e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch arrows from CPD -->
  <path d="M910,235 C940,210 940,180 963,172" fill="none" stroke="#41525e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M910,265 C940,300 940,330 963,345" fill="none" stroke="#41525e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Biosignal stream into lower branch (time alignment) -->
  <path d="M680,470 L925,470 L925,402 L963,402" fill="none" stroke="#1f8a70" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrowTeal)"/>
  <text x="802" y="462" text-anchor="middle" font-size="9.5" fill="#1f8a70">time-aligned by shared timestamp (capture_epoch_ms)</text>

  <!-- Bottom takeaway -->
  <text x="580" y="560" text-anchor="middle" font-size="13" font-style="italic" fill="#5a6b78">One visual context layer, two measurement problems addressed in parallel</text>
</svg>
