<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#41525e"/>
    </marker>
    <marker id="aViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c4ab6"/>
    </marker>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a70"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="610" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#243441">System architecture: capture, storage, VLM inference, and adaptive notification</text>
  <text x="610" y="64" text-anchor="middle" font-size="12" fill="#5a6b78">Stage 2 deployment on the KIT IISM server (Apache TLS termination, systemd)</text>

  <!-- Server container -->
  <rect x="330" y="95" width="600" height="475" rx="14" fill="#fbfcfd" stroke="#9aa7b1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="417" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7884">KIT IISM server</text>
  <text x="417" y="510" text-anchor="middle" font-size="10" fill="#8a97a1">systemd &#183; Apache TLS</text>

  <!-- ============ Edge devices (left) ============ -->
  <rect x="40" y="150" width="200" height="120" rx="10" fill="#e8f1fb" stroke="#2e6ca4" stroke-width="1.5"/>
  <text x="140" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#243441">XIAO ESP32S3 Sense  &#215;N</text>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#5a6b78">OV2640 &#183; JPEG ~1 fps</text>
  <text x="140" y="228" text-anchor="middle" font-size="11" fill="#5a6b78">NTP-synced timestamps</text>
  <text x="140" y="248" text-anchor="middle" font-size="11" fill="#5a6b78">WebSocket client</text>

  <rect x="40" y="470" width="200" height="90" rx="10" fill="#e8f1fb" stroke="#2e6ca4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="140" y="502" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#243441">Biosignal sensors</text>
  <text x="140" y="524" text-anchor="middle" font-size="10.5" fill="#5a6b78">Cardioban EKG &#183; Mendi fNIRS</text>
  <text x="140" y="543" text-anchor="middle" font-size="10" font-style="italic" fill="#8a97a1">aligned, not ingested here</text>

  <!-- ============ Apache gateway ============ -->
  <rect x="350" y="150" width="120" height="270" rx="10" fill="#fdf3e3" stroke="#c77f1a" stroke-width="1.5"/>
  <text x="410" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#243441">Apache</text>
  <text x="410" y="292" text-anchor="middle" font-size="11" fill="#5a6b78">reverse proxy</text>
  <text x="410" y="310" text-anchor="middle" font-size="11" fill="#5a6b78">TLS termination</text>
  <text x="410" y="328" text-anchor="middle" font-size="10" fill="#5a6b78">mod_proxy_wstunnel</text>

  <!-- ============ Ingestion server ============ -->
  <rect x="500" y="150" width="185" height="110" rx="10" fill="#fdf3e3" stroke="#c77f1a" stroke-width="1.5"/>
  <text x="592" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">Ingestion server</text>
  <text x="592" y="211" text-anchor="middle" font-size="11" fill="#5a6b78">Node &#183; Express &#183; ws</text>
  <text x="592" y="231" text-anchor="middle" font-size="10.5" fill="#5a6b78">frames + HTTP API + control</text>

  <!-- ============ Control-plane files ============ -->
  <rect x="710" y="150" width="185" height="110" rx="10" fill="#e5f6f2" stroke="#1f8a70" stroke-width="1.5"/>
  <text x="802" y="183" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#243441">Control-plane files</text>
  <text x="802" y="206" text-anchor="middle" font-size="11" fill="#5a6b78">assignments.json</text>
  <text x="802" y="224" text-anchor="middle" font-size="11" fill="#5a6b78">paused.json</text>
  <text x="802" y="244" text-anchor="middle" font-size="10" font-style="italic" fill="#8a97a1">plain files, in-memory</text>

  <!-- ============ Filesystem ============ -->
  <rect x="500" y="300" width="185" height="100" rx="10" fill="#e5f6f2" stroke="#1f8a70" stroke-width="1.5"/>
  <text x="592" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">Filesystem</text>
  <text x="592" y="360" text-anchor="middle" font-size="10.5" fill="#5a6b78">recordings/&#8230;/images</text>
  <text x="592" y="378" text-anchor="middle" font-size="11" fill="#5a6b78">JPEG frames</text>

  <!-- ============ SQLite ============ -->
  <rect x="710" y="300" width="185" height="100" rx="10" fill="#e5f6f2" stroke="#1f8a70" stroke-width="1.5"/>
  <text x="802" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">SQLite (WAL)</text>
  <text x="802" y="360" text-anchor="middle" font-size="11" fill="#5a6b78">frame metadata +</text>
  <text x="802" y="378" text-anchor="middle" font-size="10.5" fill="#5a6b78">VLM labels / descriptors</text>

  <!-- ============ VLM service ============ -->
  <rect x="500" y="440" width="395" height="120" rx="10" fill="#fdf3e3" stroke="#c77f1a" stroke-width="2"/>
  <text x="697" y="467" text-anchor="middle" font-size="14" font-weight="bold" fill="#243441">VLM inference service  (Python, asynchronous)</text>
  <text x="697" y="490" text-anchor="middle" font-size="10.5" fill="#3a4a56">reads pending frames from SQLite + filesystem</text>
  <text x="697" y="510" text-anchor="middle" font-size="10.5" fill="#3a4a56">runs VLM model, writes per-frame labels &amp; descriptors</text>
  <text x="697" y="530" text-anchor="middle" font-size="10.5" fill="#3a4a56">change-point detection over the recent label window</text>
  <text x="697" y="550" text-anchor="middle" font-size="10.5" fill="#3a4a56">triggers a high-priority push on a sustained activity change</text>

  <!-- ============ Push provider ============ -->
  <rect x="975" y="150" width="160" height="95" rx="10" fill="#f0eaf8" stroke="#6c4ab6" stroke-width="1.5"/>
  <text x="1055" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#243441">Expo push service</text>
  <text x="1055" y="208" text-anchor="middle" font-size="12" fill="#5a6b78">&#8594; FCM (Android)</text>
  <text x="1055" y="228" text-anchor="middle" font-size="10.5" fill="#5a6b78">high-priority</text>

  <!-- ============ Mobile app ============ -->
  <rect x="975" y="300" width="170" height="235" rx="10" fill="#f0eaf8" stroke="#6c4ab6" stroke-width="1.5"/>
  <text x="1060" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#243441">Mobile app</text>
  <text x="1060" y="356" text-anchor="middle" font-size="11" fill="#5a6b78">Expo React Native</text>
  <text x="1060" y="373" text-anchor="middle" font-size="10" font-style="italic" fill="#8a97a1">(Android)</text>
  <text x="988" y="402" font-size="10.5" fill="#3a4a56">&#8226; pause / resume</text>
  <text x="988" y="423" font-size="10.5" fill="#3a4a56">&#8226; timeline review</text>
  <text x="998" y="440" font-size="10.5" fill="#3a4a56">(TanStack Query)</text>
  <text x="988" y="464" font-size="10.5" fill="#3a4a56">&#8226; push notifications</text>
  <text x="988" y="486" font-size="10.5" fill="#3a4a56">&#8226; registers push token</text>

  <!-- ================= Arrows ================= -->
  <!-- Camera -> Apache : frames (data) -->
  <line x1="240" y1="200" x2="348" y2="200" stroke="#41525e" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="294" y="190" text-anchor="middle" font-size="10" fill="#41525e">wss:// frames</text>
  <!-- Apache -> Camera : control -->
  <line x1="348" y1="235" x2="242" y2="235" stroke="#41525e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGray)"/>
  <text x="294" y="252" text-anchor="middle" font-size="10" fill="#41525e">pause / resume</text>

  <!-- Apache -> Ingestion -->
  <line x1="470" y1="205" x2="498" y2="205" stroke="#41525e" stroke-width="2" marker-end="url(#aGray)"/>

  <!-- Ingestion -> Filesystem -->
  <line x1="592" y1="260" x2="592" y2="298" stroke="#41525e" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="600" y="283" font-size="10" fill="#41525e">JPEG</text>
  <!-- Ingestion -> SQLite -->
  <path d="M660,260 C700,278 740,282 778,298" fill="none" stroke="#41525e" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="745" y="276" font-size="10" fill="#41525e">metadata</text>

  <!-- Ingestion <-> Control files -->
  <line x1="685" y1="200" x2="710" y2="200" stroke="#41525e" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#aGray)" marker-end="url(#aGray)"/>

  <!-- VLM <-> SQLite -->
  <path d="M800,438 C796,420 800,415 802,402" fill="none" stroke="#41525e" stroke-width="2" marker-start="url(#aGray)" marker-end="url(#aGray)"/>
  <text x="812" y="424" font-size="10" fill="#41525e">read / write</text>
  <!-- VLM -> Filesystem (read) -->
  <path d="M620,438 C604,420 598,414 594,402" fill="none" stroke="#41525e" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="558" y="424" font-size="10" fill="#41525e">read JPEG</text>

  <!-- Biosignal time-alignment (dotted) -->
  <path d="M240,510 L488,510 L488,362 L498,362" fill="none" stroke="#1f8a70" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#aTeal)"/>
  <text x="362" y="524" text-anchor="middle" font-size="10" fill="#1f8a70">time-aligned by capture_epoch_ms</text>

  <!-- VLM -> Push (notification) -->
  <path d="M895,470 C950,430 952,260 973,214" fill="none" stroke="#6c4ab6" stroke-width="2.2" marker-end="url(#aViolet)"/>
  <text x="958" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#6c4ab6" transform="rotate(90 958 360)">activity change &#8594; push</text>

  <!-- Push -> Mobile -->
  <line x1="1055" y1="245" x2="1055" y2="298" stroke="#6c4ab6" stroke-width="2.2" marker-end="url(#aViolet)"/>
  <text x="1063" y="276" font-size="10" fill="#6c4ab6">push</text>

  <!-- Mobile -> Apache : HTTPS API (top route) -->
  <path d="M1145,400 L1175,400 L1175,126 L410,126 L410,148" fill="none" stroke="#41525e" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="780" y="118" text-anchor="middle" font-size="10" fill="#41525e">HTTPS: pause/resume, register token, timeline (via Apache)</text>

  <!-- ================= Legend ================= -->
  <rect x="345" y="600" width="575" height="72" rx="8" fill="#ffffff" stroke="#d3dbe0" stroke-width="1"/>
  <line x1="360" y1="622" x2="398" y2="622" stroke="#41525e" stroke-width="2"/>
  <text x="406" y="626" font-size="11" fill="#3a4a56">data plane (frames, metadata, JPEG)</text>
  <line x1="360" y1="650" x2="398" y2="650" stroke="#41525e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="406" y="654" font-size="11" fill="#3a4a56">control plane (pause/resume, assignment)</text>
  <line x1="650" y1="622" x2="688" y2="622" stroke="#1f8a70" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="696" y="626" font-size="11" fill="#3a4a56">biosignal time-alignment</text>
  <line x1="650" y1="650" x2="688" y2="650" stroke="#6c4ab6" stroke-width="2.2"/>
  <text x="696" y="654" font-size="11" fill="#3a4a56">push notification</text>
</svg>
